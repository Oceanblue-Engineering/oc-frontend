<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OceanBlue CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Zinc monochrome — premium SaaS palette (remapped from legacy "ocean")
            ocean: {
              50: "#fafafa",
              100: "#f4f4f5",
              200: "#e4e4e7",
              300: "#d4d4d8",
              400: "#a1a1aa",
              500: "#71717a", // secondary text / icon
              600: "#27272a", // PRIMARY action / active (zinc-800)
              700: "#18181b", // hover — darker (zinc-900)
              800: "#18181b", // headings / dark text (zinc-900)
              900: "#09090b", // deepest (zinc-950)
              DEFAULT: "#27272a",
            },
            // Primary — alias of the zinc monochrome scale
            primary: {
              50: "#fafafa",
              100: "#f4f4f5",
              200: "#e4e4e7",
              300: "#d4d4d8",
              400: "#a1a1aa",
              500: "#71717a",
              600: "#27272a",
              700: "#18181b",
              800: "#18181b",
              900: "#09090b",
              950: "#09090b",
              DEFAULT: "#27272a",
            },
            // Neutral — align slate to zinc for cohesive monochrome
            slate: {
              50: "#fafafa",
              100: "#f4f4f5",
              200: "#e4e4e7",
              300: "#d4d4d8",
              400: "#a1a1aa",
              500: "#71717a",
              600: "#52525b",
              700: "#3f3f46",
              800: "#27272a",
              900: "#18181b",
              950: "#09090b",
            },
            // Dark - Black/Gray
            dark: {
              50: "#F9FAFB",
              100: "#F3F4F6",
              200: "#E5E7EB",
              300: "#D1D5DB",
              400: "#9CA3AF",
              500: "#6B7280",
              600: "#4B5563",
              700: "#374151",
              800: "#1F2937",
              900: "#111827",
              950: "#030712",
              DEFAULT: "#111827",
            },
            // Button colors — zinc monochrome (semantic danger/success kept)
            btn: {
              primary: "#27272a",
              "primary-hover": "#18181b",
              secondary: "#18181b",
              "secondary-hover": "#09090b",
              danger: "#EF4444",
              "danger-hover": "#DC2626",
              success: "#22C55E",
              "success-hover": "#16A34A",
            },
            // Status colors (semantic kept; info neutralized to zinc)
            status: {
              success: "#22C55E",
              warning: "#F59E0B",
              error: "#EF4444",
              info: "#27272a",
            },
          },
          fontFamily: {
            sans: ["Satoshi", "Inter", "system-ui", "sans-serif"],
          },
          boxShadow: {
            glow: "0 0 20px rgba(24, 24, 27, 0.12)",
            "glow-sm": "0 0 10px rgba(24, 24, 27, 0.1)",
          },
          keyframes: {
            "fade-in-up": {
              "0%": { opacity: "0", transform: "translateY(8px)" },
              "100%": { opacity: "1", transform: "translateY(0)" },
            },
          },
          animation: {
            "fade-in-up": "fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) both",
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Z06-Walone';
      src: url('/font/Z06-Walone Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Helvetica-Custom';
      src: url('/font/Helvetica.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: "Satoshi", "Helvetica-Custom", "Inter", sans-serif;
    }

    /* Apply Z06-Walone font to all elements when html has lang-my class */
    .lang-my,
    .lang-my body,
    .lang-my button,
    .lang-my input,
    .lang-my select,
    .lang-my textarea,
    .lang-my div,
    .lang-my span,
    .lang-my p,
    .lang-my h1,
    .lang-my h2,
    .lang-my h3,
    .lang-my h4,
    .lang-my h5,
    .lang-my h6,
    .lang-my td,
    .lang-my th,
    .lang-my a {
      font-family: 'Z06-Walone', "Inter", sans-serif !important;
    }

    /* Apply Satoshi font to all elements when html has lang-en class */
    .lang-en,
    .lang-en body,
    .lang-en button,
    .lang-en input,
    .lang-en select,
    .lang-en textarea,
    .lang-en div,
    .lang-en span,
    .lang-en p,
    .lang-en h1,
    .lang-en h2,
    .lang-en h3,
    .lang-en h4,
    .lang-en h5,
    .lang-en h6,
    .lang-en td,
    .lang-en th,
    .lang-en a {
      font-family: 'Satoshi', 'Helvetica-Custom', "Inter", sans-serif !important;
    }

    /* Staggered entry animation for card / grid containers */
    @keyframes fade-in-up {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .stagger-children > * {
      opacity: 0;
      animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .stagger-children > *:nth-child(1) { animation-delay: 0.04s; }
    .stagger-children > *:nth-child(2) { animation-delay: 0.08s; }
    .stagger-children > *:nth-child(3) { animation-delay: 0.12s; }
    .stagger-children > *:nth-child(4) { animation-delay: 0.16s; }
    .stagger-children > *:nth-child(5) { animation-delay: 0.20s; }
    .stagger-children > *:nth-child(6) { animation-delay: 0.24s; }
    .stagger-children > *:nth-child(7) { animation-delay: 0.28s; }
    .stagger-children > *:nth-child(8) { animation-delay: 0.32s; }
    .stagger-children > *:nth-child(9) { animation-delay: 0.36s; }
    .stagger-children > *:nth-child(10) { animation-delay: 0.40s; }
    .stagger-children > *:nth-child(11) { animation-delay: 0.44s; }
    .stagger-children > *:nth-child(12) { animation-delay: 0.48s; }
    .stagger-children > *:nth-child(n+13) { animation-delay: 0.5s; }

    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .stagger-children > *,
      .animate-fade-in-up {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    /* Print styles for receipt */
    @media print {
      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      body {
        background: white;
      }
    }

    .print-only {
      display: none;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    ::-webkit-scrollbar-thumb {
      background: #d4d4d8;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a1a1aa;
    }
  </style>
  <script type="importmap">
      {
        "imports": {
          "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
          "recharts": "https://aistudiocdn.com/recharts@^3.5.0"
        }
      }
    </script>
  <link rel="stylesheet" href="/index.css" />
</head>

<body class="bg-zinc-50 text-slate-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
